# WET-OP task16 / z2 "MOF Funnel Transfer and Stirrer Setup" -- GenManip task config for the rebuilt scene
# (same structure as the official task_01 validation/mixed/mixed_1.yml and the task02-05 rebuilds).
#
# Scene : generate_asset/scene_usds/task16/scene.usda  (built by tools/build_task16_scene.py)
# Metric: genmanip/extensions/metrics/scientific_experiments/task_z2_key_steps_in_mof.py (official GenManip code).
#         No official z2 config exists; uids are the prim names without "obj_"; funnel_constraint_spec = [0, 20] deg
#         (the value suggested by the WetOPAssets/task16 package).
#
# Scoring: GenManip averages metric_weight*status inside a stage, then averages the 5 stages; the weights reproduce the
# official card (Wet-OP-Bench-doc assets/tasks.js id 16): S1 0.1, S2 0.3, S3 0.2, S4 0.1, S5 0.1 (on) + 0.2 (centred).
demonstration_configs:
- domain_randomization: &id001
    cameras:
      config_path: configs/cameras/fixed_camera_lift2_scientific_experiments.yml
      type: fixed
    random_environment:
      has_wall: false
      hdr: false
      robot_base_position: false
      robot_eepose: false
      table_texture: false
      table_type: false
      wall_texture: false
    rewrite_instruction: false
  generation_config: &id002
    action_path:
      mode: auto
      robot: 0
    articulation: []
    goal:
    # ---- S1 (0.1): funnel lifted clear of the rack
    - - - type: manip/scientific_experiments/task_z2_key_steps_in_mof
          skip_steps: 50
          succ_cnts: 50
          funnel_uid: funnel
          funnel_rack_uid: funnel_rack
          conical_flask_uid: conical_flask
          magnetic_stirrer_uid: magnetic_stirrer
          gc_liquid_mesh_prim_path: /World/_scene/task04_liquid/gc_liquid/ParticleSet
          funnel_constraint_spec: {type: AND, constraints: [{local_axis: Z, world_axis: Z, angle_range: [0, 20]}]}
          condition_type: funnel_away_from_rack
          metric_weight: 0.5
    # ---- S2 (0.3): funnel upright in the flask neck (centres < 10 mm, contact < 5 mm)
    - - - type: manip/scientific_experiments/task_z2_key_steps_in_mof
          skip_steps: 50
          succ_cnts: 100
          funnel_uid: funnel
          funnel_rack_uid: funnel_rack
          conical_flask_uid: conical_flask
          magnetic_stirrer_uid: magnetic_stirrer
          gc_liquid_mesh_prim_path: /World/_scene/task04_liquid/gc_liquid/ParticleSet
          funnel_constraint_spec: {type: AND, constraints: [{local_axis: Z, world_axis: Z, angle_range: [0, 20]}]}
          condition_type: funnel_loading_conical_flask
          metric_weight: 1.5
    # ---- S3 (0.2): >= 80 % of the cylinder liquid in the flask
    - - - type: manip/scientific_experiments/task_z2_key_steps_in_mof
          skip_steps: 50
          succ_cnts: 100
          funnel_uid: funnel
          funnel_rack_uid: funnel_rack
          conical_flask_uid: conical_flask
          magnetic_stirrer_uid: magnetic_stirrer
          gc_liquid_mesh_prim_path: /World/_scene/task04_liquid/gc_liquid/ParticleSet
          funnel_constraint_spec: {type: AND, constraints: [{local_axis: Z, world_axis: Z, angle_range: [0, 20]}]}
          condition_type: liquid_in_conical_flask
          metric_weight: 1.0
    # ---- S4 (0.1): funnel back in the rack
    - - - type: manip/scientific_experiments/task_z2_key_steps_in_mof
          skip_steps: 50
          succ_cnts: 100
          funnel_uid: funnel
          funnel_rack_uid: funnel_rack
          conical_flask_uid: conical_flask
          magnetic_stirrer_uid: magnetic_stirrer
          gc_liquid_mesh_prim_path: /World/_scene/task04_liquid/gc_liquid/ParticleSet
          funnel_constraint_spec: {type: AND, constraints: [{local_axis: Z, world_axis: Z, angle_range: [0, 20]}]}
          condition_type: funnel_loading_rack
          metric_weight: 0.5
    # ---- S5 (0.1 + 0.2): flask on the stirrer, centred on the dial (cloud mean + 12 mm, < 10 mm)
    - - - type: manip/default/sr_based_genmanip_relationship
          skip_steps: 50
          succ_cnts: 100
          obj1_uid: conical_flask
          obj2_uid: magnetic_stirrer
          position: "on"
          metric_weight: 1.0
        - type: manip/scientific_experiments/task_z2_key_steps_in_mof
          skip_steps: 50
          succ_cnts: 100
          funnel_uid: funnel
          funnel_rack_uid: funnel_rack
          conical_flask_uid: conical_flask
          magnetic_stirrer_uid: magnetic_stirrer
          gc_liquid_mesh_prim_path: /World/_scene/task04_liquid/gc_liquid/ParticleSet
          funnel_constraint_spec: {type: AND, constraints: [{local_axis: Z, world_axis: Z, angle_range: [0, 20]}]}
          condition_type: conical_flask_in_the_center_of_stirrer
          metric_weight: 2.0
    mode: manual
    planner: curobo
  instruction: Place the funnel in the neck of the Erlenmeyer flask, then pour the liquid from the graduated cylinder through the funnel. Set the graduated cylinder upright on the table. Remove the funnel and return the funnel to the funnel rack. Move the flask to the center of the magnetic hotplate stirrer plate.
  layout_config: &id003
    ignored_objects: []
    type: None
  mode: manual
  num_episode: 50
  object_config: {}
  preprocess_config: []
  robots:
  - &id004
    type: manip/lift2/R5a
    usd_path: robot_usds/lift2_scientific_experiments/robot.usd
    position: [0.0, -0.7, 0.0]
    orientation: [0.7071067812, 0.0, 0.0, 0.7071067812]
  table_uid: table
  physics_scene_config:
    BounceThreshold: 0.0
    BroadphaseType: GPU
    CollisionSystem: PCM
    EnableCCD: false
    EnableEnhancedDeterminism: false
    EnableExternalForcesEveryIteration: false
    EnableGPUDynamics: true
    EnableResidualReporting: false
    EnableSceneQuerySupport: true
    EnableStabilization: true
    FrictionCorrelationDistance: 0.02500000037252903
    FrictionOffsetThreshold: 0.03999999910593033
    FrictionType: patch
    GpuCollisionStackSize: 67108864
    GpuFoundLostAggregatePairsCapacity: 10485760
    GpuFoundLostPairsCapacity: 262144
    GpuHeapCapacity: 67108864
    GpuMaxDeformableSurfaceContacts: 1048576
    GpuMaxHairContacts: 1048576
    GpuMaxNumPartitions: 8
    GpuMaxParticleContacts: 1048576
    GpuMaxRigidContactCount: 524288
    GpuMaxRigidPatchCount: 81920
    GpuMaxSoftBodyContacts: 1048576
    GpuTempBufferCapacity: 16777216
    GpuTotalAggregatePairsCapacity: 1024
    InvertCollisionGroupFilter: false
    MaxBiasCoefficient: Inf
    MaxPositionIterationCount: 255
    MaxVelocityIterationCount: 255
    MinPositionIterationCount: 1
    MinVelocityIterationCount: 0
    ReportKinematicKinematicPairs: false
    ReportKinematicStaticPairs: false
    SolverType: TGS
    TimeStepsPerSecond: 120
    UpdateType: Synchronous
  task_name: scientific_experiments/task_z2_key_steps_in_mof/rebuilt_demo
  usd_name: scene_usds/scientific_experiments/task_z2_key_steps_in_mof/rebuilt/scene
  env_vars:
    MDL_SYSTEM_PATH: /isaac-sim/materials/:{ASSETS_DIR}/miscs/mdl/ebench/mdl
