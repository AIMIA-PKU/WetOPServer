# Evaluation variant mixed_5 (layouts/mixed_5.json, scene scenes/scene_mixed_5.usda; generated by tools/make_configs_z6.py
# from task20_demo.yml). Visual parameters of this variant (layout 'visual_apply', applied by tools/visual_z6.py):
#   {"dome_scale":0.7808,"room_yaw_deg":0,"table_color":[0.5448,0.5442,0.5614],"table_inputs":{},"liquid_color":[0.339,0.7949,1.0],"liquid_opacity":0.6,"floor":{"mode":"solid","color":[0.8039,0.8039,0.7554],"roughness":0.5},"room_offset":[0.0,0.0]}
# WET-OP z6 = task20 "Evaporative Crystallization Prep" (task_z6_evaporative_crystallization_prep) - GenManip task config
# for the rebuilt scene (same structure as generate_asset/scene_usds/task02/configs/mixed_demo.yml).
#
# Scene : generate_asset/scene_usds/task20/scene.usda (built by tools/build_z6_scene.py from layout_demo.json = mixed_1);
#         the 8 evaluation variants are scenes/scene_mixed_<k>.usda (layouts/mixed_<k>.json).
#         Copy/link to saved/assets/scene_usds/scientific_experiments/task_z6_evaporative_crystallization_prep/rebuilt/scene.usda
#         together with single_asset/ and generate_asset/single_usds/ at the same relative location.
# Metric: genmanip/extensions/metrics/scientific_experiments/task_z6_evaporative_crystallization_prep.py (official code,
#         release/1.1.0-wet-op-bench). Keys: evaporating_dish_deep_uid, b_liquid_mesh_prim_path, status_prim_path,
#         condition_type in {align_alcohol_lamp, place_evaporating_dish_deep, b_liquid_in_dish}.
#   - align_alcohol_lamp / place_evaporating_dish_deep only read the bools heating:wickUnderRing / heating:dishOnRing of the
#     status prim. Their writer is not in the public GenManip code, so the scene carries /World/_scene/heating_status
#     (both False) and the embedded OmniGraph /World/_scene/heating_controller (OnPlaybackTick -> ScriptNode running
#     tools/heating_status_z6.py GRAPH_SCRIPT, criteria in its docstring and README) that rewrites them on every app
#     tick. GenManip's eval worker enables script nodes (/app/omni.graph.scriptnode/opt_in), so no runner patch is
#     needed (same mechanism as task06's centrifuge door controller). The graph ticks on rendered steps only.
#   - b_liquid_in_dish: >= 80 % of b_liquid particles inside the convex hull of the dish point cloud (geometric, official).
#   The dish uid is evaporating_dish_deep (scene prim obj_evaporating_dish_deep) to match the official key name.
#
# Scoring: GenManip averages metric_weight*status inside a stage, then averages the stages (here 1 stage, 3 items).
# Weights reproduce the official weights (Wet-OP-Bench-doc assets/tasks.js, id 17: lamp 0.4, dish 0.4, liquid 0.2):
#   metric_weight = 3 x official weight -> 1.2 / 1.2 / 0.6.
# "Return the beaker upright" is in the instruction but not in the official score table; not scored here.
# Loaded and scored in official GenManip (S10, 2026-11-23; unpatched env.py, rendering on; tools/gm_z6.sh): the scripted
# Lift2 replay of mixed_1 scores 1.0 (sr 1.0); mixed_2..8 load and run 240 steps without errors. Also tools/task_z6.py.
demonstration_configs:
- domain_randomization: &id001
    cameras:
      config_path: configs/cameras/fixed_camera_lift2_scientific_experiments.yml
      type: fixed
    random_environment:
      has_wall: false
      hdr: false
      robot_base_position: false
      robot_eepose: false
      table_texture: false
      table_type: false
      wall_texture: false
    rewrite_instruction: false
    material_overrides:
    - prim_path: /World/_scene/task20_liquid/LiquidMaterial/PreviewSurface
      attribute: inputs:diffuseColor
      value:
      - 0.339
      - 0.7949
      - 1.0
    - prim_path: /World/_scene/table/obj_table/Looks/Material1_plastic_dark_blue/Shader
      attribute: inputs:diffuse_color
      value:
      - 0.5448
      - 0.5442
      - 0.5614
  generation_config: &id002
    action_path:
      mode: auto
      robot: 0
    articulation: {}       # GenManip's object_config parser fills this as a dict
    goal:
    # ---- S1 (single stage)
    - - - type: manip/scientific_experiments/task_z6_evaporative_crystallization_prep
          skip_steps: 50
          succ_cnts: 100
          evaporating_dish_deep_uid: evaporating_dish_deep
          b_liquid_mesh_prim_path: /World/_scene/task20_liquid/b_liquid/ParticleSet
          status_prim_path: /World/_scene/heating_status
          condition_type: align_alcohol_lamp
          metric_weight: 1.2
        - type: manip/scientific_experiments/task_z6_evaporative_crystallization_prep
          skip_steps: 50
          succ_cnts: 100
          evaporating_dish_deep_uid: evaporating_dish_deep
          b_liquid_mesh_prim_path: /World/_scene/task20_liquid/b_liquid/ParticleSet
          status_prim_path: /World/_scene/heating_status
          condition_type: place_evaporating_dish_deep
          metric_weight: 1.2
        - type: manip/scientific_experiments/task_z6_evaporative_crystallization_prep
          skip_steps: 50
          succ_cnts: 100
          evaporating_dish_deep_uid: evaporating_dish_deep
          b_liquid_mesh_prim_path: /World/_scene/task20_liquid/b_liquid/ParticleSet
          status_prim_path: /World/_scene/heating_status
          condition_type: b_liquid_in_dish
          metric_weight: 0.6
    mode: manual
    planner: curobo
  instruction: Place the alcohol lamp on the ring stand base directly below the iron ring, place the evaporating dish level on the iron ring, pour all liquid from the beaker into the evaporating dish, and return the beaker upright to the tabletop.
  layout_config: &id003
