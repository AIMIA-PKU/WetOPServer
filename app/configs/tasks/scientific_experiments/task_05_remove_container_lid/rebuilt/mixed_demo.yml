# WET-OP task_05 "Bimanual Stopper Removal" -- GenManip task config for the rebuilt scene
# (same structure as the official task_01 validation/mixed/mixed_1.yml and the task02/03/04 rebuilds).
#
# Scene : generate_asset/scene_usds/task05/scene.usda  (built by tools/build_task05_scene.py)
#         copy/link it to saved/assets/scene_usds/scientific_experiments/task_05_remove_container_lid/rebuilt/scene.usda
#         together with single_asset/ and generate_asset/single_usds/ at the same relative location.
# Metric: genmanip/extensions/metrics/scientific_experiments/task_05_remove_container_lid.py (official GenManip code).
#         No official task05 config exists; uids are the prim names without "obj_".
#
# Scoring: GenManip averages metric_weight*status inside a stage, then averages the 2 stages
#   -> S1 0.5, S2 0.5 (official card weights, Wet-OP-Bench-doc assets/tasks.js id 2).
demonstration_configs:
- domain_randomization: &id001
    cameras:
      config_path: configs/cameras/fixed_camera_lift2_scientific_experiments.yml
      type: fixed
    random_environment:
      has_wall: false
      hdr: false
      robot_base_position: false
      robot_eepose: false
      table_texture: false
      table_type: false
      wall_texture: false
    rewrite_instruction: false
  generation_config: &id002
    action_path:
      mode: auto
      robot: 0
    articulation: []
    goal:
    # ---- S1 (0.5): stopper separated from the bottle (closest point-cloud distance > 1 mm)
    - - - type: manip/scientific_experiments/task_05_remove_container_lid
          skip_steps: 50
          succ_cnts: 50
          bottle_uid: reagent_bottle
          bottle_plug_uid: bottle_stopper
          plate_uid: tray
          condition_type: plug_remove_from_bottle
          metric_weight: 1.0
    # ---- S2 (0.5): stopper on the tray (inside its XY hull, above its bottom, within 10 mm)
    - - - type: manip/scientific_experiments/task_05_remove_container_lid
          skip_steps: 50
          succ_cnts: 100
          bottle_uid: reagent_bottle
          bottle_plug_uid: bottle_stopper
          plate_uid: tray
          condition_type: plug_above_the_plate
          metric_weight: 1.0
    mode: manual
    planner: curobo
  instruction: Use the left robotic arm to hold the transparent reagent bottle on the left steady. Use the right robotic arm to remove its stopper and place the stopper on the clean tray. Return both arms to their home positions without touching any other objects.
  layout_config: &id003
    ignored_objects: []
    type: None
  mode: manual
  num_episode: 50
  object_config: {}
  preprocess_config: []
  robots:
  - &id004
    type: manip/lift2/R5a
    usd_path: robot_usds/lift2_scientific_experiments/robot.usd
    position: [0.0, -0.7, 0.0]
    orientation: [0.7071067812, 0.0, 0.0, 0.7071067812]
  table_uid: table
  physics_scene_config:
    BounceThreshold: 0.0
    BroadphaseType: GPU
    CollisionSystem: PCM
    EnableCCD: false
    EnableEnhancedDeterminism: false
    EnableExternalForcesEveryIteration: false
    EnableGPUDynamics: true
    EnableResidualReporting: false
    EnableSceneQuerySupport: true
    EnableStabilization: true
    FrictionCorrelationDistance: 0.02500000037252903
    FrictionOffsetThreshold: 0.03999999910593033
    FrictionType: patch
    GpuCollisionStackSize: 67108864
    GpuFoundLostAggregatePairsCapacity: 10485760
    GpuFoundLostPairsCapacity: 262144
    GpuHeapCapacity: 67108864
    GpuMaxDeformableSurfaceContacts: 1048576
    GpuMaxHairContacts: 1048576
    GpuMaxNumPartitions: 8
    GpuMaxParticleContacts: 1048576
    GpuMaxRigidContactCount: 524288
    GpuMaxRigidPatchCount: 81920
    GpuMaxSoftBodyContacts: 1048576
    GpuTempBufferCapacity: 16777216
    GpuTotalAggregatePairsCapacity: 1024
    InvertCollisionGroupFilter: false
    MaxBiasCoefficient: Inf
    MaxPositionIterationCount: 255
    MaxVelocityIterationCount: 255
    MinPositionIterationCount: 1
    MinVelocityIterationCount: 0
    ReportKinematicKinematicPairs: false
    ReportKinematicStaticPairs: false
    SolverType: TGS
    TimeStepsPerSecond: 120
    UpdateType: Synchronous
  task_name: scientific_experiments/task_05_remove_container_lid/rebuilt_demo
  usd_name: scene_usds/scientific_experiments/task_05_remove_container_lid/rebuilt/scene
  env_vars:
    MDL_SYSTEM_PATH: /isaac-sim/materials/:{ASSETS_DIR}/miscs/mdl/ebench/mdl
evaluation_configs:
- domain_randomization: *id001
  generation_config: *id002
  instruction: Use the left robotic arm to hold the transparent reagent bottle on the left steady. Use the right robotic arm to remove its stopper and place the stopper on the clean tray. Return both arms to their home positions without touching any other objects.
