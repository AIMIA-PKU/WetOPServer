# WET-OP task_04 "Funnel-Assisted Liquid Transfer" -- GenManip task config for the rebuilt scene
# (same structure as the official task_01 validation/mixed/mixed_1.yml and the task02 rebuild).
#
# Scene : generate_asset/scene_usds/task04/scene.usda  (built by tools/build_task04_scene.py)
#         copy/link it to saved/assets/scene_usds/scientific_experiments/task_04_pour_liquid_with_funnel/rebuilt/scene.usda
#         together with single_asset/ and generate_asset/single_usds/ at the same relative location.
# Metric: genmanip/extensions/metrics/scientific_experiments/task_04_pour_liquid_with_funnel.py (official GenManip code,
#         GenManip-main checkout on this server); no official task04 config exists, the condition parameters follow it.
#
# Scoring: GenManip averages metric_weight*status inside a stage, then averages the 3 stages.
# Weights reproduce the official stage weights (Wet-OP-Bench-doc assets/tasks.js, id 6):
#   S1  funnel lifted clear of the rack (> 5 mm), upright                    0.9 / 3        = 0.30
#   S2  funnel upright in the bottle neck, centres < 1 cm, contact < 5 mm    0.9 / 3        = 0.30
#   S3  >= 80 % of the cylinder liquid in the bottle  +  cylinder upright    1.8/2/3 = 0.30,  0.6/2/3 = 0.10
demonstration_configs:
- domain_randomization: &id001
    cameras:
      config_path: configs/cameras/fixed_camera_lift2_scientific_experiments.yml
      type: fixed
    random_environment:
      has_wall: false
      hdr: false
      robot_base_position: false
      robot_eepose: false
      table_texture: false
      table_type: false
      wall_texture: false
    rewrite_instruction: false
  generation_config: &id002
    action_path:
      mode: auto
      robot: 0
    articulation: []
    goal:
    # ---- S1
    - - - type: manip/scientific_experiments/task_04_pour_liquid_with_funnel
          skip_steps: 50
          succ_cnts: 50
          funnel_uid: funnel
          funnel_rack_uid: funnel_stand
          target_reagent_bottle_uid: receiving_bottle
          gc_liquid_mesh_prim_path: /World/_scene/task04_liquid/gc_liquid/ParticleSet
          funnel_constraint_spec: {type: AND, constraints: [{local_axis: Z, world_axis: Z, angle_range: [0, 20]}]}
          condition_type: timing_1
          metric_weight: 0.9
    # ---- S2
    - - - type: manip/scientific_experiments/task_04_pour_liquid_with_funnel
          skip_steps: 50
          succ_cnts: 100
          funnel_uid: funnel
          funnel_rack_uid: funnel_stand
          target_reagent_bottle_uid: receiving_bottle
          gc_liquid_mesh_prim_path: /World/_scene/task04_liquid/gc_liquid/ParticleSet
          funnel_constraint_spec: {type: AND, constraints: [{local_axis: Z, world_axis: Z, angle_range: [0, 20]}]}
          condition_type: timing_2
          metric_weight: 0.9
    # ---- S3
    - - - type: manip/scientific_experiments/task_04_pour_liquid_with_funnel
          skip_steps: 100
          succ_cnts: 100
          funnel_uid: funnel
          funnel_rack_uid: funnel_stand
          target_reagent_bottle_uid: receiving_bottle
          gc_liquid_mesh_prim_path: /World/_scene/task04_liquid/gc_liquid/ParticleSet
          funnel_constraint_spec: {type: AND, constraints: [{local_axis: Z, world_axis: Z, angle_range: [0, 20]}]}
          condition_type: timing_3
          metric_weight: 1.8
        - type: manip/default/match_local_world_orientation
          skip_steps: 50
          succ_cnts: 100
          obj_uid: graduated_cylinder
          constraint_spec: {type: AND, constraints: [{local_axis: Y, world_axis: Z, angle_range: [0, 10]}]}
          metric_weight: 0.6
    mode: manual
    planner: curobo
  instruction: Use the right robotic arm to pick up the funnel from the funnel stand and place it on the reagent bottle; next, use the left robotic arm to empty the graduated cylinder through the funnel into the bottle and return the cylinder upright to the table.
  layout_config: &id003
    ignored_objects: []
    type: None
  mode: manual
  num_episode: 50
  object_config: {}
  preprocess_config: []
  robots:
  - &id004
    type: manip/lift2/R5a
    usd_path: robot_usds/lift2_scientific_experiments/robot.usd
    position: [0.0, -0.7, 0.0]
    orientation: [0.7071067812, 0.0, 0.0, 0.7071067812]
  table_uid: table
  physics_scene_config:
    BounceThreshold: 0.0
    BroadphaseType: GPU
    CollisionSystem: PCM
    EnableCCD: false
    EnableEnhancedDeterminism: false
    EnableExternalForcesEveryIteration: false
    EnableGPUDynamics: true
    EnableResidualReporting: false
    EnableSceneQuerySupport: true
    EnableStabilization: true
    FrictionCorrelationDistance: 0.02500000037252903
    FrictionOffsetThreshold: 0.03999999910593033
    FrictionType: patch
    GpuCollisionStackSize: 67108864
    GpuFoundLostAggregatePairsCapacity: 10485760
    GpuFoundLostPairsCapacity: 262144
    GpuHeapCapacity: 67108864
    GpuMaxDeformableSurfaceContacts: 1048576
    GpuMaxHairContacts: 1048576
    GpuMaxNumPartitions: 8
    GpuMaxParticleContacts: 1048576
    GpuMaxRigidContactCount: 524288
    GpuMaxRigidPatchCount: 81920
    GpuMaxSoftBodyContacts: 1048576
    GpuTempBufferCapacity: 16777216
    GpuTotalAggregatePairsCapacity: 1024
    InvertCollisionGroupFilter: false
    MaxBiasCoefficient: Inf
    MaxPositionIterationCount: 255
    MaxVelocityIterationCount: 255
    MinPositionIterationCount: 1
    MinVelocityIterationCount: 0
    ReportKinematicKinematicPairs: false
    ReportKinematicStaticPairs: false
    SolverType: TGS
    TimeStepsPerSecond: 120
    UpdateType: Synchronous
  task_name: scientific_experiments/task_04_pour_liquid_with_funnel/rebuilt_demo
  usd_name: scene_usds/scientific_experiments/task_04_pour_liquid_with_funnel/rebuilt/scene
  env_vars:
    MDL_SYSTEM_PATH: /isaac-sim/materials/:{ASSETS_DIR}/miscs/mdl/ebench/mdl
