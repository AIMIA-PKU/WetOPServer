# WET-OP task_02 "Liquid Transfer and Stirring" — GenManip task config for the rebuilt scene
# (same structure as the official task_01 validation/mixed/mixed_1.yml).
#
# Scene : generate_asset/scene_usds/task02/scene.usda  (built by tools/build_task02_scene.py)
#         copy/link it to saved/assets/scene_usds/scientific_experiments/task_02_pour_liquid_and_stir/rebuilt/scene.usda
#         together with single_asset/ and generate_asset/single_usds/ at the same relative location.
# Metric: genmanip/extensions/metrics/scientific_experiments/task_02_pour_liquid_and_stir.py (official GenManip code)
#
# Scoring: GenManip averages metric_weight*status inside a stage, then averages the 4 stages.
# Weights reproduce the official stage weights (Wet-OP-Bench-doc assets/tasks.js, id 5):
#   S1  >=45% cylinder liquid in beaker                       0.8 / 4         = 0.20
#   S2  >=90% cylinder liquid in beaker                       0.8 / 4         = 0.20
#   S3  glass rod in the beaker, below the liquid surface     1.6 / 4         = 0.40
#   S4  beaker liquid kept / cylinder liquid kept / beaker upright / cylinder upright / rod on tray
#                                                             0.8 / 5 / 4     = 0.04 each
demonstration_configs:
- domain_randomization: &id001
    cameras:
      config_path: configs/cameras/fixed_camera_lift2_scientific_experiments.yml
      type: fixed
    random_environment:
      has_wall: false
      hdr: false
      robot_base_position: false
      robot_eepose: false
      table_texture: false
      table_type: false
      wall_texture: false
    rewrite_instruction: false
  generation_config: &id002
    action_path:
      mode: auto
      robot: 0
    articulation: []
    goal:
    # ---- S1
    - - - type: manip/scientific_experiments/task_02_pour_liquid_and_stir
          skip_steps: 100
          succ_cnts: 100
          graduated_cylinder_uid: graduated_cylinder
          beaker_uid: beaker
          glass_rod_uid: glass_rod
          plate_uid: tray
          gc_liquid_mesh_prim_path: /World/_scene/task02_liquid/gc_liquid/ParticleSet
          b_liquid_mesh_prim_path: /World/_scene/task02_liquid/b_liquid/ParticleSet
          condition_type: timing_1
          metric_weight: 0.8
    # ---- S2
    - - - type: manip/scientific_experiments/task_02_pour_liquid_and_stir
          skip_steps: 100
          succ_cnts: 100
          graduated_cylinder_uid: graduated_cylinder
          beaker_uid: beaker
          glass_rod_uid: glass_rod
          plate_uid: tray
          gc_liquid_mesh_prim_path: /World/_scene/task02_liquid/gc_liquid/ParticleSet
          b_liquid_mesh_prim_path: /World/_scene/task02_liquid/b_liquid/ParticleSet
          condition_type: timing_2
          metric_weight: 0.8
    # ---- S3
    - - - type: manip/scientific_experiments/task_02_pour_liquid_and_stir
          skip_steps: 50
          succ_cnts: 50
          graduated_cylinder_uid: graduated_cylinder
          beaker_uid: beaker
          glass_rod_uid: glass_rod
          plate_uid: tray
          gc_liquid_mesh_prim_path: /World/_scene/task02_liquid/gc_liquid/ParticleSet
          b_liquid_mesh_prim_path: /World/_scene/task02_liquid/b_liquid/ParticleSet
          condition_type: timing_3
          metric_weight: 1.6
    # ---- S4
    - - - type: manip/scientific_experiments/task_02_pour_liquid_and_stir
          skip_steps: 100
          succ_cnts: 100
          graduated_cylinder_uid: graduated_cylinder
          beaker_uid: beaker
          glass_rod_uid: glass_rod
          plate_uid: tray
          gc_liquid_mesh_prim_path: /World/_scene/task02_liquid/gc_liquid/ParticleSet
          b_liquid_mesh_prim_path: /World/_scene/task02_liquid/b_liquid/ParticleSet
          condition_type: timing_4/beaker_liquid_in_beaker
          metric_weight: 0.8
        - type: manip/scientific_experiments/task_02_pour_liquid_and_stir
          skip_steps: 100
          succ_cnts: 100
          graduated_cylinder_uid: graduated_cylinder
          beaker_uid: beaker
          glass_rod_uid: glass_rod
          plate_uid: tray
          gc_liquid_mesh_prim_path: /World/_scene/task02_liquid/gc_liquid/ParticleSet
          b_liquid_mesh_prim_path: /World/_scene/task02_liquid/b_liquid/ParticleSet
          condition_type: timing_4/graduated_cylinder_liquid_in_beaker
          metric_weight: 0.8
        - type: manip/default/match_local_world_orientation
          skip_steps: 50
          succ_cnts: 100
          obj_uid: beaker
          constraint_spec: {type: AND, constraints: [{local_axis: Z, world_axis: Z, angle_range: [0, 10]}]}
          metric_weight: 0.8
        - type: manip/default/match_local_world_orientation
          skip_steps: 50
          succ_cnts: 100
          obj_uid: graduated_cylinder
          constraint_spec: {type: AND, constraints: [{local_axis: Y, world_axis: Z, angle_range: [0, 10]}]}
          metric_weight: 0.8
        - type: manip/default/sr_based_genmanip_relationship
          skip_steps: 50
          succ_cnts: 100
          obj1_uid: glass_rod
          obj2_uid: tray
          position: "on"
          metric_weight: 0.8
    mode: manual
    planner: curobo
  instruction: Pour all liquid from the graduated cylinder into the beaker, stand the empty cylinder upright on the table, stir the liquid with the glass stirring rod, and place the glass stirring rod on the clean tray.
  layout_config: &id003
    ignored_objects: []
    type: None
  mode: manual
  num_episode: 50
  object_config: {}
  preprocess_config: []
  robots:
  - &id004
    type: manip/lift2/R5a
    usd_path: robot_usds/lift2_scientific_experiments/robot.usd
    position: [0.0, -0.7, 0.0]
    orientation: [0.7071067812, 0.0, 0.0, 0.7071067812]
  table_uid: table
  physics_scene_config:
    BounceThreshold: 0.0
    BroadphaseType: GPU
    CollisionSystem: PCM
    EnableCCD: false
    EnableEnhancedDeterminism: false
    EnableExternalForcesEveryIteration: false
    EnableGPUDynamics: true
    EnableResidualReporting: false
    EnableSceneQuerySupport: true
    EnableStabilization: true
    FrictionCorrelationDistance: 0.02500000037252903
    FrictionOffsetThreshold: 0.03999999910593033
    FrictionType: patch
    GpuCollisionStackSize: 67108864
    GpuFoundLostAggregatePairsCapacity: 10485760
    GpuFoundLostPairsCapacity: 262144
    GpuHeapCapacity: 67108864
    GpuMaxDeformableSurfaceContacts: 1048576
    GpuMaxHairContacts: 1048576
    GpuMaxNumPartitions: 8
    GpuMaxParticleContacts: 1048576
    GpuMaxRigidContactCount: 524288
    GpuMaxRigidPatchCount: 81920
    GpuMaxSoftBodyContacts: 1048576
    GpuTempBufferCapacity: 16777216
    GpuTotalAggregatePairsCapacity: 1024
    InvertCollisionGroupFilter: false
    MaxBiasCoefficient: Inf
    MaxPositionIterationCount: 255
    MaxVelocityIterationCount: 255
    MinPositionIterationCount: 1
    MinVelocityIterationCount: 0
    ReportKinematicKinematicPairs: false
    ReportKinematicStaticPairs: false
    SolverType: TGS
    TimeStepsPerSecond: 120
    UpdateType: Synchronous
  task_name: scientific_experiments/task_02_pour_liquid_and_stir/rebuilt_demo
  usd_name: scene_usds/scientific_experiments/task_02_pour_liquid_and_stir/rebuilt/scene
  env_vars:
    MDL_SYSTEM_PATH: /isaac-sim/materials/:{ASSETS_DIR}/miscs/mdl/ebench/mdl
